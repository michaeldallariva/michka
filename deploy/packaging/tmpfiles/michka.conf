# systemd-tmpfiles: .NET single-file native-extraction scratch dir for the DynamicUser AGENT.
# Under DynamicUser the systemd StateDirectory is mounted noexec (idmapped), which breaks the
# single-file native lib (e_sqlite3) self-extraction. This plain /var/lib dir is exposed to the agent
# via ReadWritePaths= and stays exec inside the sandbox. Sticky (1777) so the transient dynamic user
# can write its own extraction subdir without a fixed owner (its UID is not stable).
#
# The HUB no longer needs this: it runs as a STATIC system user whose StateDirectory (/var/lib/michka)
# is exec-capable, so it self-extracts into /var/lib/michka/.bundle directly (see michka-hub.service).
d /var/lib/michka-agent-bundle 1777 root root -
